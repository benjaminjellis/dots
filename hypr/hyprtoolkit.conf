# Classic Mac OS System 7 palette for Hyprtoolkit apps (e.g. hyprlauncher)
background=0xffc6c6c6
base=0xffefefef
alternate_base=0xffa8a8a8
text=0xff000000
bright_text=0xffffffff
link_text=0xff000000
accent=0xff000000
accent_secondary=0xff7a7a7a

# Keep classic-era square UI surfaces
rounding_large=0
rounding_small=0

# Compact typography matching classic Macintosh UI feel
h1_size=12
h2_size=12
h3_size=11
small_font_size=10
font_family=Liberation Sans
font_family_monospace=Liberation Mono
